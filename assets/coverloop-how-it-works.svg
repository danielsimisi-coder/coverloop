<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 726" width="1240" height="726" role="img" aria-label="How Coverloop works: you request a change, an AI builder writes it, independent models and your tests attack it, a fail-closed gate opens only when hashed commit-bound evidence is complete, and you hold the final gate on dangerous changes. Review scales to risk from L0 to L3.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1224"/>
      <stop offset="1" stop-color="#141E3A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34E0B4"/>
      <stop offset="1" stop-color="#22C7E6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22C7E6" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22C7E6" stop-opacity="0"/>
    </radialGradient>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#34E0B4"/>
    </marker>
    <marker id="arwLoop" markerWidth="9" markerHeight="9" refX="6" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#7C7CFF"/>
    </marker>
    <style>
      .h  { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .m  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .step { font-weight:700; fill:#F0F3FF; }
      .sub  { fill:#9AA6C6; }
      .tag  { font-weight:700; letter-spacing:1px; }
    </style>
  </defs>

  <rect width="1240" height="726" fill="url(#bg)"/>
  <circle cx="620" cy="150" r="360" fill="url(#glow)"/>

  <!-- ===== title ===== -->
  <g transform="translate(620,58)" text-anchor="middle">
    <text class="h" y="0" font-size="40" font-weight="800" fill="#F0F3FF" letter-spacing="-1">How Coverloop works</text>
    <text class="m" y="34" font-size="16" font-weight="600" fill="#34E0B4">one builds · many review · tests decide · you gate</text>
  </g>

  <!-- ===== promise banner ===== -->
  <g transform="translate(300,116)">
    <rect x="0" y="0" width="640" height="52" rx="14" fill="#141d38" stroke="#2A3556"/>
    <circle cx="34" cy="26" r="13" fill="url(#accent)"/>
    <path d="M27 26 l5 5 l10 -12" fill="none" stroke="#0B1224" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="h" x="62" y="32" font-size="20" font-weight="700" fill="#EAF0FF">The model that writes the code never approves it.</text>
  </g>

  <!-- ===== flow arrows (drawn under cards) ===== -->
  <g stroke="#34E0B4" stroke-width="3" fill="none">
    <line x1="196" y1="316" x2="228" y2="316" marker-end="url(#arw)"/>
    <line x1="404" y1="316" x2="436" y2="316" marker-end="url(#arw)"/>
    <line x1="812" y1="316" x2="844" y2="316" marker-end="url(#arw)"/>
    <line x1="1028" y1="316" x2="1060" y2="316" marker-end="url(#arw)"/>
  </g>
  <text class="m" x="828" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#34E0B4">PASS</text>

  <!-- ===== STEP 1: you request ===== -->
  <g transform="translate(44,214)">
    <rect width="152" height="204" rx="16" fill="#1b2540" stroke="#33406a"/>
    <text class="m" x="16" y="26" font-size="11" font-weight="700" fill="#7C7CFF">STEP 1</text>
    <g transform="translate(76,86)" stroke="#AEB9E6" stroke-width="3.5" fill="none">
      <circle cx="0" cy="-8" r="13"/>
      <path d="M-22 26 a22 20 0 0 1 44 0" stroke-linecap="round"/>
    </g>
    <text class="h step" x="76" y="150" text-anchor="middle" font-size="17">YOU</text>
    <text class="h sub" x="76" y="174" text-anchor="middle" font-size="12.5">request a change</text>
  </g>

  <!-- ===== STEP 2: builder ===== -->
  <g transform="translate(236,214)">
    <rect width="168" height="204" rx="16" fill="#1b2442" stroke="#3a3f78"/>
    <text class="m" x="16" y="26" font-size="11" font-weight="700" fill="#7C7CFF">STEP 2</text>
    <g transform="translate(84,84)" stroke="#8f9bff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-20 -10 l-14 14 l14 14"/>
      <path d="M20 -10 l14 14 l-14 14"/>
    </g>
    <text class="h step" x="84" y="150" text-anchor="middle" font-size="17">AI BUILDER</text>
    <text class="h sub" x="84" y="174" text-anchor="middle" font-size="12.5">writes the diff · Claude Code</text>
  </g>

  <!-- ===== STEP 3: independent checks ===== -->
  <g transform="translate(444,196)">
    <rect width="364" height="240" rx="18" fill="#141d33" stroke="#22C7E6" stroke-opacity="0.55"/>
    <text class="m" x="18" y="28" font-size="11" font-weight="700" fill="#22C7E6">STEP 3</text>
    <text class="h step" x="182" y="30" text-anchor="middle" font-size="18">INDEPENDENT CHECKS</text>
    <text class="h sub" x="182" y="50" text-anchor="middle" font-size="12">different lineages catch different failures</text>

    <!-- code review -->
    <g transform="translate(16,66)">
      <rect width="106" height="112" rx="12" fill="#1a2238" stroke="#2c3b63"/>
      <g transform="translate(53,34)" stroke="#8f9bff" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-13 -8 l-9 9 l9 9"/><path d="M13 -8 l9 9 l-9 9"/>
      </g>
      <text class="h" x="53" y="74" text-anchor="middle" font-size="12.5" font-weight="700" fill="#EAF0FF">Codex</text>
      <text class="h sub" x="53" y="93" text-anchor="middle" font-size="10.5">correctness</text>
    </g>
    <!-- red team -->
    <g transform="translate(129,66)">
      <rect width="106" height="112" rx="12" fill="#1a2238" stroke="#2c3b63"/>
      <path transform="translate(53,20)" d="M0 0 l16 6 v13 c0 12 -8 20 -16 25 c-8 -5 -16 -13 -16 -25 v-13 z" fill="none" stroke="#22C7E6" stroke-width="3" stroke-linejoin="round"/>
      <text class="h" x="53" y="74" text-anchor="middle" font-size="12.5" font-weight="700" fill="#EAF0FF">GLM · M3</text>
      <text class="h sub" x="53" y="93" text-anchor="middle" font-size="10.5">security · audit</text>
    </g>
    <!-- tests -->
    <g transform="translate(242,66)">
      <rect width="106" height="112" rx="12" fill="#13241b" stroke="#2f6f4c"/>
      <g transform="translate(53,28)"><circle r="15" fill="none" stroke="#34E0B4" stroke-width="3"/>
        <path d="M-7 0 l5 6 l10 -13" fill="none" stroke="#34E0B4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g>
      <text class="h" x="53" y="74" text-anchor="middle" font-size="12.5" font-weight="700" fill="#EAF0FF">Tests</text>
      <text class="h sub" x="53" y="93" text-anchor="middle" font-size="10.5">execution decides</text>
    </g>

    <text class="h" x="182" y="220" text-anchor="middle" font-size="11.5" font-weight="600" fill="#9AA6C6">no model is an authority — every finding is verified against the real code</text>
  </g>

  <!-- ===== STEP 4: gate ===== -->
  <g transform="translate(848,214)">
    <rect width="180" height="204" rx="16" fill="#122a22" stroke="#34E0B4" stroke-opacity="0.7"/>
    <text class="m" x="16" y="26" font-size="11" font-weight="700" fill="#34E0B4">STEP 4</text>
    <g transform="translate(90,78)" stroke="#34E0B4" stroke-width="3.5" fill="none">
      <rect x="-26" y="-22" width="52" height="44" rx="4"/>
      <line x1="-26" y1="-8" x2="26" y2="-8"/><line x1="-26" y1="8" x2="26" y2="8"/>
      <line x1="-9" y1="-22" x2="-9" y2="22"/><line x1="9" y1="-22" x2="9" y2="22"/>
    </g>
    <text class="h step" x="90" y="140" text-anchor="middle" font-size="16">COVERLOOP</text>
    <text class="h step" x="90" y="160" text-anchor="middle" font-size="16">GATE</text>
    <text class="h sub" x="90" y="182" text-anchor="middle" font-size="10.5">opens on complete evidence</text>
  </g>

  <!-- tamper-evidence callout (the crux) -->
  <g transform="translate(792,440)">
    <rect width="292" height="52" rx="12" fill="#0f1f30" stroke="#22C7E6" stroke-opacity="0.6"/>
    <path transform="translate(26,26)" d="M0 -13 l13 5 v10 c0 10 -7 16 -13 20 c-6 -4 -13 -10 -13 -20 v-10 z" fill="none" stroke="#22C7E6" stroke-width="2.5" stroke-linejoin="round"/>
    <text class="h" x="52" y="22" font-size="12.5" font-weight="700" fill="#EAF0FF">Evidence is hashed &amp; bound to the commit.</text>
    <text class="h" x="52" y="40" font-size="12.5" font-weight="700" fill="#34E0B4">No “trust me” — it can’t be faked.</text>
  </g>
  <line x1="938" y1="418" x2="938" y2="440" stroke="#22C7E6" stroke-width="2" stroke-opacity="0.6"/>

  <!-- ===== STEP 5: ship ===== -->
  <g transform="translate(1060,214)">
    <rect width="140" height="204" rx="16" fill="#241f3c" stroke="#F2C94C" stroke-opacity="0.75"/>
    <text class="m" x="16" y="26" font-size="11" font-weight="700" fill="#F2C94C">STEP 5</text>
    <g transform="translate(70,84)" stroke="#F2C94C" stroke-width="3.5" fill="none" stroke-linejoin="round">
      <path d="M0 -30 c14 10 14 30 6 44 h-12 c-8 -14 -8 -34 6 -44 z"/>
      <circle cx="0" cy="-6" r="5"/><path d="M-6 20 l-8 12 M6 20 l8 12" stroke-linecap="round"/>
    </g>
    <text class="h step" x="70" y="150" text-anchor="middle" font-size="16">YOU · SHIP</text>
    <text class="h sub" x="70" y="174" text-anchor="middle" font-size="11">human gate on L2 · L3</text>
  </g>

  <!-- ===== loop-back arrow ===== -->
  <path d="M626 436 C 626 486, 320 486, 320 430" fill="none" stroke="#7C7CFF" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#arwLoop)"/>
  <g transform="translate(360,470)">
    <rect x="0" y="0" width="256" height="30" rx="15" fill="#1a1f3e" stroke="#7C7CFF" stroke-opacity="0.6"/>
    <text class="h" x="128" y="20" text-anchor="middle" font-size="12.5" font-weight="700" fill="#B9BEFF">findings or red tests → fix &amp; repeat</text>
  </g>

  <!-- ===== risk ladder ===== -->
  <g transform="translate(44,540)">
    <rect width="1152" height="150" rx="18" fill="#101832" stroke="#2A3556"/>
    <text class="h" x="28" y="42" font-size="17" font-weight="800" fill="#F0F3FF">More risk = more review</text>
    <text class="h sub" x="28" y="66" font-size="12.5">Coverloop scales the checks to the blast radius — a typo never gets a committee.</text>

    <g transform="translate(28,86)">
      <rect width="262" height="46" rx="12" fill="#16203c" stroke="#33406a"/>
      <circle cx="30" cy="23" r="15" fill="#22304f"/>
      <text class="m" x="30" y="28" text-anchor="middle" font-size="13" font-weight="800" fill="#9AA6C6">L0</text>
      <text class="h" x="56" y="20" font-size="12.5" font-weight="700" fill="#EAF0FF">TRIVIAL</text>
      <text class="h sub" x="56" y="36" font-size="11">copy · docs · CSS</text>
    </g>
    <g transform="translate(306,86)">
      <rect width="262" height="46" rx="12" fill="#16203c" stroke="#33406a"/>
      <circle cx="30" cy="23" r="15" fill="#22304f"/>
      <text class="m" x="30" y="28" text-anchor="middle" font-size="13" font-weight="800" fill="#8f9bff">L1</text>
      <text class="h" x="56" y="20" font-size="12.5" font-weight="700" fill="#EAF0FF">NORMAL</text>
      <text class="h sub" x="56" y="36" font-size="11">tests + typecheck</text>
    </g>
    <g transform="translate(584,86)">
      <rect width="262" height="46" rx="12" fill="#16203c" stroke="#3a4a7a"/>
      <circle cx="30" cy="23" r="15" fill="#243a5c"/>
      <text class="m" x="30" y="28" text-anchor="middle" font-size="13" font-weight="800" fill="#22C7E6">L2</text>
      <text class="h" x="56" y="20" font-size="12.5" font-weight="700" fill="#EAF0FF">PRODUCT FLOW</text>
      <text class="h sub" x="56" y="36" font-size="11">+ independent review</text>
    </g>
    <g transform="translate(862,86)">
      <rect width="262" height="46" rx="12" fill="#182a24" stroke="#34E0B4" stroke-opacity="0.6"/>
      <circle cx="30" cy="23" r="15" fill="#1d3a2e"/>
      <text class="m" x="30" y="28" text-anchor="middle" font-size="13" font-weight="800" fill="#34E0B4">L3</text>
      <text class="h" x="56" y="20" font-size="12.5" font-weight="700" fill="#EAF0FF">DANGEROUS</text>
      <text class="h sub" x="56" y="36" font-size="9.5">money · auth · DB → full loop + your gate</text>
    </g>
  </g>
</svg>
