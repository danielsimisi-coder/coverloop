<svg xmlns="http://www.w3.org/2000/svg" width="880" height="392" viewBox="0 0 880 392" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
  <!-- Real GLM-5.2 red-team transcript, captured 2026-07-11 on a coverloop gate hunk. Verbatim; elided with … -->
  <rect x="0" y="0" width="880" height="392" rx="12" fill="#0d1117" stroke="#30363d"/>
  <rect x="0" y="0" width="880" height="36" rx="12" fill="#161b22"/>
