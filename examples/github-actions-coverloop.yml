# Copy to .github/workflows/coverloop.yml in YOUR project, then make
# "coverloop / gate" a required status check in branch protection.
# Full docs: https://github.com/danielsimisi-coder/coverloop/blob/main/docs/GATE.md
name: coverloop
on: pull_request
permissions:
  contents: read              # least-privilege job token
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full commit SHA (not a mutable tag) — a tag can be moved to
      # point at malicious code; a SHA can't.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Check out the REAL PR head SHA (a validated commit id, not a branch
          # name — no ref-injection surface), not GitHub's synthetic merge
          # commit: the evidence reports live on the PR branch, and the merge
          # commit's first-parent chain walks the BASE branch, where they don't exist.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0  # the gate diffs against the PR base
      - name: Coverloop gate
        env:
          # Immutable supply-chain pin. BOTH values travel together — bump them
          # on every upgrade to a release you have vetted:
          #   COVERLOOP_SHA    = the release commit SHA (immutable, unlike a tag)
          #   COVERLOOP_SHA256 = shasum -a 256 bin/coverloop  at that commit
          # Verifying the checksum means a moved tag or a tampered CDN response
          # can't slip modified gate code into your CI.
          COVERLOOP_SHA: 87a2e4b3f005c38e7058e855747337bc4d1b4bb7        # v2.10.0 (adds classify)
          COVERLOOP_SHA256: a271d7bdab85c5b5506981321255c7ce586f6dcfd4f9af18d74478ee83e8a3ff
          # base_ref via env, NEVER interpolated straight into the shell — a ref
          # name can carry shell metacharacters; ${{ }} inline would let it run.
          BASE_REF: ${{ github.base_ref }}
        run: |
          curl -fsSL -o coverloop \
            "https://raw.githubusercontent.com/danielsimisi-coder/coverloop/${COVERLOOP_SHA}/bin/coverloop"
          echo "${COVERLOOP_SHA256}  coverloop" | shasum -a 256 -c - || {
            echo "::error title=coverloop::checksum mismatch — refusing to run unverified gate code"; exit 1; }
          chmod +x coverloop
          # --min-tier L2 : a true RISK FLOOR — the effective tier is
          #                 max(this, the report's self-declared tier), so it can
          #                 only RAISE requirements, never downgrade an L3 change.
          # --require-transcript : reject bare "codex pass" claims — demand a
          #                 committed, hashed reviewer transcript (attest
          #                 --codex-run "<cmd>", or --codex-log <file> to attach
          #                 a review that already ran). Use --require-executed
          #                 to additionally reject attached transcripts.
          # The floor is DERIVED from the paths this PR actually changed, so a
          # migration or an auth file cannot arrive labelled L1. classify only
          # ever raises; your own --min-tier below is a second floor, not a cap.
          FLOOR="$(./coverloop classify --quiet --base "origin/${BASE_REF}")"
          echo "derived risk floor for this PR: ${FLOOR}"
          ./coverloop gate --ci --min-tier "${FLOOR}" --min-tier L1 --require-transcript --base "origin/${BASE_REF}"
