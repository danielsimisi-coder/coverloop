# Copy to .github/workflows/coverloop.yml in YOUR project, then make
# "coverloop / gate" a required status check in branch protection.
# Full docs: https://github.com/danielsimisi-coder/coverloop/blob/main/docs/GATE.md
name: coverloop
on: pull_request
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the REAL PR head, not GitHub's synthetic merge commit —
          # the evidence reports live on the PR branch, and the merge commit's
          # first-parent chain walks the BASE branch, where they don't exist.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0  # the gate diffs against the PR base
      - name: Coverloop gate
        run: |
          # Pin to a RELEASE TAG, never main — don't run live code from an
          # external branch in your CI. Bump the tag deliberately.
          COVERLOOP_REF=v2.6.1
          curl -fsSL -o coverloop \
            "https://raw.githubusercontent.com/danielsimisi-coder/coverloop/${COVERLOOP_REF}/bin/coverloop"
          chmod +x coverloop
          # Pin a RISK FLOOR with --tier so a PR can't dodge review by
          # self-declaring a lower tier. Set it to your repo's real minimum
          # (L2 = every PR needs an independent review recorded); drop it only
          # if a human reviews the declared tier on each PR.
          ./coverloop gate --ci --tier L2 --base "origin/${{ github.base_ref }}"
