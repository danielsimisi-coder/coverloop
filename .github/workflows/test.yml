# Coverloop's OWN CI — continuously proves the gate on every push and PR.
# stdlib-only, so no install step. SUPPORTED + REQUIRED green: Linux and macOS,
# across Python 3.9/3.11/3.13. Windows runs too (for signal), but is currently
# EXPERIMENTAL / continue-on-error: some tests assume POSIX file semantics (a few
# leak file handles that Windows locks; cp1252 vs utf-8 defaults), so the Windows
# leg is not green yet — tracked as WIP, not claimed as passing.
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    # Windows is experimental (WIP) — let it run for signal without failing the
    # overall check or the branch. Linux + macOS remain required-green.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.11', '3.13']
    steps:
      # Pinned to full commit SHAs (not mutable tags) — supply-chain hygiene.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      # `python` (not `python3`): setup-python guarantees `python` on PATH for
      # the selected version on all three OSes; `python3` is not aliased on the
      # Windows runner, which would fail the whole Windows leg (Sol + GLM R3).
      - name: Gate test suite
        run: python tests/test_gate.py
      - name: Property / fuzz / concurrency tests
        run: python tests/test_properties.py
      # The shell hooks are POSIX (bash + pwd -P + git). They ship for Unix; on
      # Windows they run under Git Bash / WSL, which the hosted windows runner's
      # default shell is not — so this leg is Unix-only rather than claiming an
      # unverified Windows pass. The Python gate (above) runs on all three OSes.
      - name: Stop-hook behavioral tests
        if: runner.os != 'Windows'
        run: bash tests/test_hooks.sh
